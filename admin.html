<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Área Administrativa — Fortaleza Digital</title>
<link rel="stylesheet" href="style.css">
<style>
  .admin-wrap { max-width: 640px; margin: 0 auto; padding: 40px 20px; }
  .admin-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
  .admin-box h2 { font-size: 18px; margin-bottom: 16px; }
  .admin-field { margin-bottom: 14px; }
  .admin-field label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
  .admin-field input, .admin-field textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 10px; font-size: 14px; font-family: inherit;
  }
  .admin-field textarea { min-height: 70px; resize: vertical; }
  .admin-btn {
    background: var(--accent); color: var(--accent-ink); border: none; border-radius: 8px;
    padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .admin-btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .admin-btn.danger { background: #E05252; color: #fff; }
  .item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); gap: 10px; }
  .item-row:last-child { border-bottom: none; }
  .item-info { flex: 1; }
  .item-info strong { display: block; font-size: 14px; }
  .item-info span { font-size: 12px; color: var(--text-muted); }
  .item-actions { display: flex; gap: 6px; }
  .item-actions button { font-size: 12px; padding: 6px 10px; }
  #login-screen { text-align: center; }
  #login-screen input { margin-bottom: 10px; }
  .error-msg { color: #E05252; font-size: 13px; margin-top: 8px; }
  .success-msg { color: var(--accent); font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="34" height="34">
          <path d="M20 3 L34 9 V19 C34 28 28 34 20 37 C12 34 6 28 6 19 V9 Z" fill="none" stroke="#2DD4BF" stroke-width="2"/>
          <path d="M20 11 L27 14.5 V19.5 C27 25 24 28.5 20 30.5 C16 28.5 13 25 13 19.5 V14.5 Z" fill="#101B30" stroke="#2DD4BF" stroke-width="1.5"/>
        </svg>
      </span>
      <div>
        <p class="brand-name">Fortaleza Digital</p>
        <p class="brand-tag">Área administrativa</p>
      </div>
    </div>
    <nav class="site-nav">
      <a href="index.html">Voltar ao site</a>
    </nav>
  </div>
</header>

<div class="admin-wrap">

  <!-- TELA DE LOGIN -->
  <div id="login-screen" class="admin-box">
    <h2>Entrar</h2>
    <div class="admin-field">
      <input type="email" id="login-email" placeholder="Seu e-mail">
    </div>
    <div class="admin-field">
      <input type="password" id="login-senha" placeholder="Sua senha">
    </div>
    <button class="admin-btn" onclick="fazerLogin()">Entrar</button>
    <p id="login-erro" class="error-msg"></p>
  </div>

  <!-- PAINEL (só aparece depois do login) -->
  <div id="painel" style="display:none">

    <div class="admin-box">
      <h2>Serviços</h2>
      <div id="lista-servicos"></div>
      <hr style="border-color: var(--border); margin: 16px 0;">
      <p style="font-size:13px; color: var(--text-muted); margin-bottom: 10px;">Adicionar novo serviço</p>
      <div class="admin-field">
        <label>Título</label>
        <input type="text" id="novo-servico-titulo">
      </div>
      <div class="admin-field">
        <label>Descrição</label>
        <textarea id="novo-servico-descricao"></textarea>
      </div>
      <div class="admin-field">
        <label>Ordem (número)</label>
        <input type="number" id="novo-servico-ordem">
      </div>
      <button class="admin-btn" onclick="adicionarServico()">Adicionar serviço</button>
    </div>

    <div class="admin-box">
      <h2>Portfólio</h2>
      <div id="lista-portfolio"></div>
      <hr style="border-color: var(--border); margin: 16px 0;">
      <p style="font-size:13px; color: var(--text-muted); margin-bottom: 10px;">Adicionar novo projeto</p>
      <div class="admin-field">
        <label>Título do projeto</label>
        <input type="text" id="novo-projeto-titulo">
      </div>
      <div class="admin-field">
        <label>Descrição</label>
        <textarea id="novo-projeto-descricao"></textarea>
      </div>
      <button class="admin-btn" onclick="adicionarProjeto()">Adicionar projeto</button>
    </div>

    <div class="admin-box">
      <h2>Contato</h2>
      <div class="admin-field">
        <label>WhatsApp (só números, com DDI e DDD, ex: 5564999998888)</label>
        <input type="text" id="contato-whatsapp">
      </div>
      <div class="admin-field">
        <label>E-mail</label>
        <input type="text" id="contato-email">
      </div>
      <button class="admin-btn" onclick="salvarContato()">Salvar contato</button>
      <p id="contato-msg" class="success-msg"></p>
    </div>

    <div class="admin-box">
      <h2>Sua conta</h2>
      <button class="admin-btn secondary" onclick="trocarSenha()">Trocar minha senha</button>
      <button class="admin-btn secondary" onclick="sair()">Sair</button>
      <p id="senha-msg" class="success-msg"></p>
    </div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="admin.js"></script>
</body>
</html>
